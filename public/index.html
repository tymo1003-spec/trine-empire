<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TRINE EMPIRE - L1 Core</title>
    <style>
        body {
            background-color: #030712;
            color: #00f3ff;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
        }
        .citadel-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            min-height: 420px;
            background: radial-gradient(circle, #081426 0%, #030712 100%);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .city-header-hud {
            width: 90%;
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            padding-bottom: 8px;
        }
        .city-kanji { color: #ff0055; font-weight: bold; font-size: 1.1rem; text-shadow: 0 0 8px #ff0055; }
        .city-title { color: #00f3ff; font-weight: bold; letter-spacing: 2px; font-size: 0.9rem; text-shadow: 0 0 10px #00f3ff; }
        .city-yield { color: #ffcc00; font-weight: bold; font-size: 0.85rem; text-shadow: 0 0 8px #ffcc00; }
        .city-svg { width: 100%; height: 350px; }
        .kanji-sign { fill: #00f3ff; font-size: 14px; font-weight: bold; writing-mode: tb; letter-spacing: 4px; }
        .kanji-sign.magenta { fill: #ff0055; }
        .kanji-core { fill: #ffffff; font-size: 12px; font-weight: bold; opacity: 0.8; }
        .shield-dome {
            fill: none;
            stroke: #00f3ff;
            stroke-width: 1;
            stroke-dasharray: 6 6;
            opacity: 0.4;
            animation: rotateDome 40s linear infinite;
        }
        .traffic-line { animation: trafficMove 3s linear infinite; }
        .traffic-line-rev { animation: trafficMoveRev 4s linear infinite; }
        @keyframes trafficMove { from { stroke-dashoffset: 40; } to { stroke-dashoffset: 0; } }
        @keyframes trafficMoveRev { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 40; } }
        @keyframes rotateDome { from { transform: rotate(0deg); transform-origin: 250px 250px; } to { transform: rotate(360deg); transform-origin: 250px 250px; } }
        .reactor-glow { animation: reactorPulse 2s ease-in-out infinite alternate; }
        @keyframes reactorPulse {
            0% { r: 28px; opacity: 0.7; }
            100% { r: 38px; opacity: 1; filter: drop-shadow(0 0 15px #00f3ff); }
        }
        .shockwave {
            fill: none;
            stroke: #00f3ff;
            stroke-width: 3;
            opacity: 0;
            transform-origin: 250px 260px;
        }
        .shockwave.active { animation: shockwaveExpand 0.8s ease-out; }
        @keyframes shockwaveExpand {
            0% { r: 20px; opacity: 1; stroke: #00f3ff; }
            50% { stroke: #ff0055; }
            100% { r: 220px; opacity: 0; stroke-width: 1; }
        }
        .hero-pad { fill: #051329; stroke: #00f3ff; stroke-width: 1.5; transition: all 0.5s ease; }
        .hero-pad.active-hero { fill: #ff0055; stroke: #ffffff; filter: drop-shadow(0 0 10px #ff0055); }
        .floating-reward {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffcc00;
            font-size: 1.8rem;
            font-weight: bold;
            text-shadow: 0 0 15px #ffcc00;
            opacity: 0;
            pointer-events: none;
        }
        .floating-reward.animate { animation: floatUp 1.2s ease-out forwards; }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, -20px) scale(0.8); }
            50% { transform: translate(-50%, -70px) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -120px) scale(1); }
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        button {
            background: linear-gradient(135deg, #00f3ff, #0055ff);
            border: none;
            color: #fff;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
        }
        button:hover { background: linear-gradient(135deg, #ff0055, #ff00aa); box-shadow: 0 0 15px rgba(255, 0, 85, 0.6); }
    </style>
</head>
<body>
    <div class="citadel-container" id="citadelContainer">
        <div class="city-header-hud">
            <span class="city-kanji">都市核心</span>
            <span class="city-title">NEO-SEOUL CITADEL L1</span>
            <span class="city-yield" id="cityYieldText">+50 TRN/ЦИКЛ</span>
        </div>
        <svg class="city-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="neonCyan" x1="0%" y1="100%" x2="0%" y2="0%">
                    <stop offset="0%" stop-color="#001122" stop-opacity="0.8"/>
                    <stop offset="100%" stop-color="#00f3ff" stop-opacity="0.9"/>
                </linearGradient>
                <linearGradient id="neonMagenta" x1="0%" y1="100%" x2="0%" y2="0%">
                    <stop offset="0%" stop-color="#220011" stop-opacity="0.8"/>
                    <stop offset="100%" stop-color="#ff0055" stop-opacity="0.9"/>
                </linearGradient>
                <radialGradient id="corePulse" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#00f3ff" stop-opacity="1"/>
                    <stop offset="50%" stop-color="#ff0055" stop-opacity="0.5"/>
                    <stop offset="100%" stop-color="#050b14" stop-opacity="0"/>
                </radialGradient>
                <filter id="glow">
                    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>
            <circle cx="250" cy="250" r="210" class="shield-dome" filter="url(#glow)"/>
            <g class="city-backlayer">
                <rect x="70" y="180" width="35" height="180" fill="#091829" rx="2"/>
                <rect x="120" y="140" width="45" height="220" fill="#0c1f36" rx="2"/>
                <rect x="330" y="150" width="40" height="210" fill="#0c1f36" rx="2"/>
                <rect x="380" y="190" width="35" height="170" fill="#091829" rx="2"/>
            </g>
            <g class="city-midlayer">
                <rect x="100" y="200" width="55" height="180" fill="url(#neonCyan)" stroke="#00f3ff" stroke-width="1" filter="url(#glow)"/>
                <text x="110" y="230" class="kanji-sign">電力</text>
                <rect x="345" y="190" width="55" height="190" fill="url(#neonMagenta)" stroke="#ff0055" stroke-width="1" filter="url(#glow)"/>
                <text x="358" y="220" class="kanji-sign magenta">防衛</text>
                <line x1="155" y1="250" x2="345" y2="250" stroke="#00f3ff" stroke-dasharray="8 4" stroke-width="2" class="traffic-line"/>
                <line x1="155" y1="310" x2="345" y2="310" stroke="#ff0055" stroke-dasharray="12 6" stroke-width="1.5" class="traffic-line-rev"/>
            </g>
            <g class="city-core">
                <polygon points="250,110 290,170 290,360 210,360 210,170" fill="#051329" stroke="#00f3ff" stroke-width="2" filter="url(#glow)"/>
                <circle cx="250" cy="260" r="35" fill="url(#corePulse)" id="mainReactor" class="reactor-glow"/>
                <circle cx="250" cy="260" r="18" fill="#ffffff" filter="url(#glow)"/>
                <text x="243" y="190" class="kanji-core">核心</text>
            </g>
            <g id="heroesPlatforms">
                <circle cx="180" cy="380" r="12" class="hero-pad" id="pad1"/>
                <circle cx="250" cy="400" r="12" class="hero-pad" id="pad2"/>
                <circle cx="320" cy="380" r="12" class="hero-pad" id="pad3"/>
            </g>
            <circle cx="250" cy="260" r="10" class="shockwave" id="shockWave"/>
        </svg>
        <div class="floating-reward" id="floatingReward">+50 TRN</div>
    </div>
    <div class="controls">
        <button id="pulseBtn">⚡ ПУЛЬС ЦИКЛУ</button>
        <button id="heroBtn">✨ СТВОРИТИ ГЕРОЯ</button>
    </div>
    <script>
        let heroCount = 0;
        const pulseBtn = document.getElementById('pulseBtn');
        const heroBtn = document.getElementById('heroBtn');

        function triggerPulseEffect() {
            const shock = document.getElementById('shockWave');
            const reward = document.getElementById('floatingReward');
            shock.classList.remove('active');
            void shock.offsetWidth;
            shock.classList.add('active');
            reward.classList.remove('animate');
            void reward.offsetWidth;
            reward.classList.add('animate');
        }

        function triggerHeroEffect() {
            heroCount++;
            const padId = `pad${((heroCount - 1) % 3) + 1}`;
            const pad = document.getElementById(padId);
            if (pad) pad.classList.add('active-hero');
            triggerPulseEffect();
        }

        if (pulseBtn) pulseBtn.addEventListener('click', triggerPulseEffect);
        if (heroBtn) heroBtn.addEventListener('click', triggerHeroEffect);
    </script>
</body>
</html>
