version: "3.8"

services:
  trine-node-1:
    build: .
    environment:
      - PORT=3001
      - P2P_PORT=6001
    networks:
      - trine-net

  trine-node-2:
    build: .
    environment:
      - PORT=3002
      - P2P_PORT=6002
      - PEERS=ws://trine-node-1:6001
    depends_on:
      - trine-node-1
    networks:
      - trine-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      trine-node-1:
        condition: service_started
      trine-node-2:
        condition: service_started
    networks:
      - trine-net

networks:
  trine-net:
    driver: bridge
